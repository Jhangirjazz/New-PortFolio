name: Build and Deploy

env:
  CI: false
  # Optional: these populate the Open Source / GitHub profile section.
  # Leave them unset to skip the GitHub fetch entirely (avoids build failures).
  GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
  REACT_APP_GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  USE_GITHUB_DATA: ${{ secrets.USE_GITHUB_DATA }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build

      - name: Disable Jekyll ✂️
        run: touch build/.nojekyll

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          BRANCH: gh-pages # The branch the action should deploy to.
          FOLDER: build # The folder the action should deploy.
          CLEAN: true
